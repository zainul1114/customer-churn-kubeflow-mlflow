name: Customer Churn CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-build:
    name: Test and Build API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r customer_churn_project/api/requirements.txt

      - name: Run API tests
        run: |
          pytest -v tests/test_customer_churn_api.py

      - name: Build Docker image
        run: |
          docker build \
            -t customer-churn-api:ci \
            customer_churn_project/api
