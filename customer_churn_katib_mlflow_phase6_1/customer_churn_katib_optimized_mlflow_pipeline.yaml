# PIPELINE DEFINITION
# Name: customer-churn-katib-optimized-mlflow
# Description: Final RandomForest training using Katib-selected hyperparameters and MLflow tracking.
# Inputs:
#    max_depth: int [Default: 7.0]
#    min_samples_split: int [Default: 9.0]
#    n_estimators: int [Default: 117.0]
components:
  comp-create-dataset:
    executorLabel: exec-create-dataset
    outputDefinitions:
      artifacts:
        output_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-preprocess-data:
    executorLabel: exec-preprocess-data
    inputDefinitions:
      artifacts:
        input_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        output_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-optimized-model:
    executorLabel: exec-train-optimized-model
    inputDefinitions:
      artifacts:
        input_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        max_depth:
          parameterType: NUMBER_INTEGER
        min_samples_split:
          parameterType: NUMBER_INTEGER
        n_estimators:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-create-dataset:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - create_dataset
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\
          \ 'numpy==1.26.4' 'scikit-learn==1.5.2'  &&  python3 -m pip install --quiet\
          \ --no-warn-script-location 'kfp==2.16.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef create_dataset(\n    output_dataset: Output[Dataset],\n):\n \
          \   import os\n    import pandas as pd\n    import numpy as np\n\n    np.random.seed(42)\n\
          \n    n = 1000\n\n    age = np.random.randint(18, 75, n)\n\n    tenure =\
          \ np.random.randint(1, 72, n)\n\n    monthly_charges = np.round(\n     \
          \   np.random.uniform(20, 150, n),\n        2,\n    )\n\n    total_charges\
          \ = np.maximum(\n        np.round(\n            monthly_charges * tenure\n\
          \            + np.random.normal(0, 100, n),\n            2,\n        ),\n\
          \        monthly_charges,\n    )\n\n    contract_type = np.random.choice(\n\
          \        [\n            \"Month-to-month\",\n            \"One year\",\n\
          \            \"Two year\",\n        ],\n        n,\n        p=[\n      \
          \      0.55,\n            0.25,\n            0.20,\n        ],\n    )\n\n\
          \    support_calls = np.random.randint(\n        0,\n        12,\n     \
          \   n,\n    )\n\n    churn_probability = (\n        0.15\n        + (contract_type\
          \ == \"Month-to-month\") * 0.20\n        + (monthly_charges > 90) * 0.15\n\
          \        + (support_calls >= 6) * 0.20\n        + (tenure < 12) * 0.15\n\
          \    )\n\n    churn = (\n        np.random.random(n)\n        < churn_probability\n\
          \    ).astype(int)\n\n    df = pd.DataFrame(\n        {\n            \"\
          customer_id\": [\n                f\"CUST-{i:05d}\"\n                for\
          \ i in range(1, n + 1)\n            ],\n            \"age\": age,\n    \
          \        \"tenure\": tenure,\n            \"monthly_charges\": monthly_charges,\n\
          \            \"total_charges\": total_charges,\n            \"contract_type\"\
          : contract_type,\n            \"support_calls\": support_calls,\n      \
          \      \"churn\": churn,\n        }\n    )\n\n    os.makedirs(\n       \
          \ os.path.dirname(output_dataset.path),\n        exist_ok=True,\n    )\n\
          \n    df.to_csv(\n        output_dataset.path,\n        index=False,\n \
          \   )\n\n"
        image: python:3.11-slim
    exec-preprocess-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - preprocess_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\
          \ 'numpy==1.26.4' 'scikit-learn==1.5.2'  &&  python3 -m pip install --quiet\
          \ --no-warn-script-location 'kfp==2.16.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef preprocess_data(\n    input_dataset: Input[Dataset],\n    output_dataset:\
          \ Output[Dataset],\n):\n    import os\n    import pandas as pd\n\n    from\
          \ sklearn.model_selection import (\n        train_test_split,\n    )\n\n\
          \    df = pd.read_csv(\n        input_dataset.path,\n    )\n\n    df[\"\
          contract_type\"] = (\n        df[\"contract_type\"].astype(str)\n    )\n\
          \n    df = pd.get_dummies(\n        df,\n        columns=[\"contract_type\"\
          ],\n        dtype=int,\n    )\n\n    train_df, test_df = train_test_split(\n\
          \        df,\n        test_size=0.20,\n        random_state=42,\n      \
          \  stratify=df[\"churn\"],\n    )\n\n    result = pd.concat(\n        [\n\
          \            train_df.assign(\n                _split=\"train\"\n      \
          \      ),\n            test_df.assign(\n                _split=\"test\"\n\
          \            ),\n        ],\n        ignore_index=True,\n    )\n\n    os.makedirs(\n\
          \        os.path.dirname(output_dataset.path),\n        exist_ok=True,\n\
          \    )\n\n    result.to_csv(\n        output_dataset.path,\n        index=False,\n\
          \    )\n\n"
        image: python:3.11-slim
    exec-train-optimized-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_optimized_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\
          \ 'numpy==1.26.4' 'scikit-learn==1.5.2' 'mlflow==3.16.1' 'psycopg2-binary==2.9.13'\
          \ 'boto3' 'botocore'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_optimized_model(\n    input_dataset: Input[Dataset],\n\
          \    n_estimators: int,\n    max_depth: int,\n    min_samples_split: int,\n\
          \    model: Output[Model],\n    metrics: Output[Metrics],\n):\n    import\
          \ os\n    import json\n    import pandas as pd\n\n    import mlflow\n  \
          \  import mlflow.sklearn\n\n    from sklearn.ensemble import (\n       \
          \ RandomForestClassifier,\n    )\n\n    from sklearn.metrics import (\n\
          \        accuracy_score,\n        precision_score,\n        recall_score,\n\
          \        f1_score,\n    )\n\n    # --------------------------------------------------------\n\
          \    # MLflow configuration\n    # --------------------------------------------------------\n\
          \n    mlflow.set_tracking_uri(\n        \"http://mlflow.ml-registry.svc.cluster.local:5000\"\
          \n    )\n\n    # MLflow artifact store = separate MinIO\n    #\n    # This\
          \ is NOT KFP/SeaweedFS.\n    #\n    os.environ[\n        \"MLFLOW_S3_ENDPOINT_URL\"\
          \n    ] = (\n        \"http://minio.ml-registry.svc.cluster.local:9000\"\
          \n    )\n\n    os.environ[\n        \"AWS_DEFAULT_REGION\"\n    ] = \"us-east-1\"\
          \n\n    mlflow.set_experiment(\n        \"customer-churn\"\n    )\n\n  \
          \  # --------------------------------------------------------\n    # Load\
          \ data\n    # --------------------------------------------------------\n\
          \n    df = pd.read_csv(\n        input_dataset.path,\n    )\n\n    train_df\
          \ = df[\n        df[\"_split\"] == \"train\"\n    ].copy()\n\n    test_df\
          \ = df[\n        df[\"_split\"] == \"test\"\n    ].copy()\n\n    drop_columns\
          \ = [\n        \"customer_id\",\n        \"churn\",\n        \"_split\"\
          ,\n    ]\n\n    X_train = train_df.drop(\n        columns=drop_columns\n\
          \    )\n\n    y_train = train_df[\"churn\"]\n\n    X_test = test_df.drop(\n\
          \        columns=drop_columns\n    )\n\n    y_test = test_df[\"churn\"]\n\
          \n    # --------------------------------------------------------\n    #\
          \ MLflow run\n    # --------------------------------------------------------\n\
          \n    with mlflow.start_run(\n        run_name=\"katib-optimized-randomforest\"\
          \n    ) as run:\n\n        classifier = RandomForestClassifier(\n      \
          \      n_estimators=int(\n                n_estimators\n            ),\n\
          \            max_depth=int(\n                max_depth\n            ),\n\
          \            min_samples_split=int(\n                min_samples_split\n\
          \            ),\n            random_state=42,\n        )\n\n        classifier.fit(\n\
          \            X_train,\n            y_train,\n        )\n\n        # ----------------------------------------------------\n\
          \        # Predictions\n        # ----------------------------------------------------\n\
          \n        train_predictions = (\n            classifier.predict(X_train)\n\
          \        )\n\n        test_predictions = (\n            classifier.predict(X_test)\n\
          \        )\n\n        # ----------------------------------------------------\n\
          \        # Metrics\n        # ----------------------------------------------------\n\
          \n        train_accuracy = accuracy_score(\n            y_train,\n     \
          \       train_predictions,\n        )\n\n        test_accuracy = accuracy_score(\n\
          \            y_test,\n            test_predictions,\n        )\n\n     \
          \   test_precision = precision_score(\n            y_test,\n           \
          \ test_predictions,\n            zero_division=0,\n        )\n\n       \
          \ test_recall = recall_score(\n            y_test,\n            test_predictions,\n\
          \            zero_division=0,\n        )\n\n        test_f1 = f1_score(\n\
          \            y_test,\n            test_predictions,\n            zero_division=0,\n\
          \        )\n\n        # ----------------------------------------------------\n\
          \        # MLflow parameters\n        # ----------------------------------------------------\n\
          \n        mlflow.log_params(\n            {\n                \"model_type\"\
          :\n                    \"RandomForestClassifier\",\n\n                \"\
          optimization\":\n                    \"Katib Random Search\",\n\n      \
          \          \"n_estimators\":\n                    int(n_estimators),\n\n\
          \                \"max_depth\":\n                    int(max_depth),\n\n\
          \                \"min_samples_split\":\n                    int(min_samples_split),\n\
          \n                \"random_state\":\n                    42,\n\n       \
          \         \"training_rows\":\n                    len(X_train),\n\n    \
          \            \"test_rows\":\n                    len(X_test),\n\n      \
          \          \"feature_count\":\n                    X_train.shape[1],\n \
          \           }\n        )\n\n        # ----------------------------------------------------\n\
          \        # MLflow metrics\n        # ----------------------------------------------------\n\
          \n        mlflow.log_metrics(\n            {\n                \"training_accuracy\"\
          :\n                    float(train_accuracy),\n\n                \"test_accuracy\"\
          :\n                    float(test_accuracy),\n\n                \"test_precision\"\
          :\n                    float(test_precision),\n\n                \"test_recall\"\
          :\n                    float(test_recall),\n\n                \"test_f1\"\
          :\n                    float(test_f1),\n            }\n        )\n\n   \
          \     # ----------------------------------------------------\n        #\
          \ Log model to MLflow MinIO\n        # ----------------------------------------------------\n\
          \n        mlflow.sklearn.log_model(\n            classifier,\n         \
          \   artifact_path=\"model\",\n            skops_trusted_types=[\n      \
          \          \"sklearn.tree._tree.Tree\"\n            ],\n        )\n\n  \
          \      # ----------------------------------------------------\n        #\
          \ Save result metadata\n        # ----------------------------------------------------\n\
          \n        result = {\n            \"run_id\":\n                run.info.run_id,\n\
          \n            \"optimization\":\n                \"Katib Random Search\"\
          ,\n\n            \"n_estimators\":\n                int(n_estimators),\n\
          \n            \"max_depth\":\n                int(max_depth),\n\n      \
          \      \"min_samples_split\":\n                int(min_samples_split),\n\
          \n            \"training_accuracy\":\n                float(train_accuracy),\n\
          \n            \"test_accuracy\":\n                float(test_accuracy),\n\
          \n            \"test_precision\":\n                float(test_precision),\n\
          \n            \"test_recall\":\n                float(test_recall),\n\n\
          \            \"test_f1\":\n                float(test_f1),\n        }\n\n\
          \        result_path = os.path.join(\n            os.path.dirname(model.path),\n\
          \            \"optimized_model_result.json\",\n        )\n\n        with\
          \ open(\n            result_path,\n            \"w\",\n        ) as f:\n\
          \            json.dump(\n                result,\n                f,\n \
          \               indent=2,\n            )\n\n        mlflow.log_artifact(\n\
          \            result_path,\n            artifact_path=\"evaluation\",\n \
          \       )\n\n        # ----------------------------------------------------\n\
          \        # KFP metrics\n        # ----------------------------------------------------\n\
          \n        metrics.log_metric(\n            \"training_accuracy\",\n    \
          \        float(train_accuracy),\n        )\n\n        metrics.log_metric(\n\
          \            \"test_accuracy\",\n            float(test_accuracy),\n   \
          \     )\n\n        metrics.log_metric(\n            \"test_precision\",\n\
          \            float(test_precision),\n        )\n\n        metrics.log_metric(\n\
          \            \"test_recall\",\n            float(test_recall),\n       \
          \ )\n\n        metrics.log_metric(\n            \"test_f1\",\n         \
          \   float(test_f1),\n        )\n\n        # ----------------------------------------------------\n\
          \        # KFP model artifact\n        # ----------------------------------------------------\n\
          \n        os.makedirs(\n            os.path.dirname(model.path),\n     \
          \       exist_ok=True,\n        )\n\n        with open(\n            model.path,\n\
          \            \"w\",\n        ) as f:\n            json.dump(\n         \
          \       result,\n                f,\n                indent=2,\n       \
          \     )\n\n"
        image: python:3.11-slim
pipelineInfo:
  description: Final RandomForest training using Katib-selected hyperparameters and
    MLflow tracking.
  name: customer-churn-katib-optimized-mlflow
root:
  dag:
    tasks:
      create-dataset:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-create-dataset
        taskInfo:
          name: create-dataset
      preprocess-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-preprocess-data
        dependentTasks:
        - create-dataset
        inputs:
          artifacts:
            input_dataset:
              taskOutputArtifact:
                outputArtifactKey: output_dataset
                producerTask: create-dataset
        taskInfo:
          name: preprocess-data
      train-optimized-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-optimized-model
        dependentTasks:
        - preprocess-data
        inputs:
          artifacts:
            input_dataset:
              taskOutputArtifact:
                outputArtifactKey: output_dataset
                producerTask: preprocess-data
          parameters:
            max_depth:
              componentInputParameter: max_depth
            min_samples_split:
              componentInputParameter: min_samples_split
            n_estimators:
              componentInputParameter: n_estimators
        taskInfo:
          name: train-optimized-model
  inputDefinitions:
    parameters:
      max_depth:
        defaultValue: 7.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      min_samples_split:
        defaultValue: 9.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      n_estimators:
        defaultValue: 117.0
        isOptional: true
        parameterType: NUMBER_INTEGER
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.0
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-train-optimized-model:
          secretAsEnv:
          - keyToEnv:
            - envVar: AWS_ACCESS_KEY_ID
              secretKey: AWS_ACCESS_KEY_ID
            - envVar: AWS_SECRET_ACCESS_KEY
              secretKey: AWS_SECRET_ACCESS_KEY
            optional: false
            secretName: mlflow-s3-credentials
            secretNameParameter:
              runtimeValue:
                constant: mlflow-s3-credentials
